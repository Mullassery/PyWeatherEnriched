[package]
name = "pyweatherenriched"
version = "0.6.0"
edition = "2021"
authors = ["Georgi Mammen Mullassery <mullassery@gmail.com>"]
license = "Proprietary"
description = "Hyperlocal weather enrichment engine for operational data"
repository = "https://github.com/Mullassery/PyWeatherEnriched"

[lib]
name = "pyweatherenriched"
crate-type = ["cdylib", "rlib"]

[dependencies]
# `extension-module` is opt-in (see [features] below), not a default pyo3
# feature: with it always on, `cargo test`/`cargo build --bin ...` fail to
# link because the resulting binary isn't loaded by a Python interpreter
# that supplies libpython's symbols at runtime the way a real extension
# module is. maturin enables it explicitly for wheel builds (see
# pyproject.toml's [tool.maturin] features).
pyo3 = { version = "0.23", features = ["abi3-py310"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# rustls instead of the default OpenSSL/native-tls backend: pure Rust, no
# system OpenSSL dependency, so cross-compiled release builds (aarch64
# Linux, etc. in CI) don't need a cross-compiled OpenSSL toolchain.
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
redis = "0.25"
tiff = "0.9"
geojson = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
lru = "0.12"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
clap = { version = "4.4", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "pyweatherenriched-validate"
path = "src/bin/validate.rs"

[features]
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
mockito = "1.5"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
