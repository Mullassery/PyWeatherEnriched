[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyweatherenriched"
dynamic = ["version"]
description = "Hyperlocal weather enrichment engine for operational data - street/building-level precision"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]
keywords = [
    "weather",
    "enrichment",
    "hyperlocal",
    "geocoding",
    "operational-data",
    "delivery",
    "retail",
    "healthcare",
    "iot",
    "data-engineering",
    "feature-engineering",
    "machine-learning",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
# Embedded architecture/knowledge-graph engine behind tools/codeatlas.
architecture = ["codeatlas-rs>=0.3.0"]
dev = [
    "pytest>=9.0.3",  # >=9.0.3 to avoid PYSEC-2026-1845 (see ROADMAP_HONEST.md)
    # The runner's bundled setuptools is 79.0.1, which pip-audit flags for
    # PYSEC-2026-3447 (fixed in 83.0.0). Pin the floor so the audit job's
    # `pip install -e ".[dev]"` upgrades it before pip-audit scans.
    "setuptools>=83.0.0",
]

[project.urls]
Homepage = "https://github.com/Mullassery/PyWeatherEnriched"
"Bug Tracker" = "https://github.com/Mullassery/PyWeatherEnriched/issues"
Documentation = "https://github.com/Mullassery/PyWeatherEnriched#readme"
"Source Code" = "https://github.com/Mullassery/PyWeatherEnriched"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "pyweatherenriched._pyweatherenriched"
features = ["extension-module"]
sdist-include = ["README.md"]
