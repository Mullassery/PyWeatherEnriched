[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyweatherenriched"
dynamic = ["version"]
description = "Hyperlocal weather enrichment engine for operational data - street/building-level precision"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
]
keywords = [
    "weather",
    "enrichment",
    "hyperlocal",
    "geocoding",
    "operational-data",
    "delivery",
    "retail",
    "healthcare",
    "iot",
    "data-engineering",
    "feature-engineering",
    "machine-learning",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Mullassery/PyWeatherEnriched"
"Bug Tracker" = "https://github.com/Mullassery/PyWeatherEnriched/issues"
Documentation = "https://github.com/Mullassery/PyWeatherEnriched#readme"
"Source Code" = "https://github.com/Mullassery/PyWeatherEnriched"

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "python"
module-name = "pyweatherenriched._pyweatherenriched"
features = ["extension-module"]
sdist-include = ["README.md"]
