[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyweatherenriched"
version = "0.1.0"
description = "Hyperlocal weather enrichment engine for operational data - street/building-level precision"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Georgi Mammen Mullassery", email = "mullassery@gmail.com"}
]
keywords = [
    "weather",
    "enrichment",
    "hyperlocal",
    "geocoding",
    "operational-data",
    "delivery",
    "retail",
    "healthcare",
    "iot",
    "data-engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/Mullassery/PyWeatherEnriched"
"Bug Tracker" = "https://github.com/Mullassery/PyWeatherEnriched/issues"
Documentation = "https://github.com/Mullassery/PyWeatherEnriched#readme"
"Source Code" = "https://github.com/Mullassery/PyWeatherEnriched"

[tool.maturin]
features = ["pyo3/abi3-py310"]
sdist-include = ["README.md", "DATA_FORMATS_GUIDE.md", "ARCHITECTURE.md", "PHASE2_3_SUMMARY.md"]
